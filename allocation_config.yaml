# Offerbook Lending Allocation Config
# =====================================
# Maps each collateral token (by mint address) to a fraction of your total
# available USDC balance that you are willing to offer in that market.
#
#   1.0  = up to 100% of your balance  (e.g. 300 USDC if you have 300)
#   0.5  = up to 50%  (150 USDC)
#   0.0  = skip this market entirely
#
# HOW IT WORKS WITH THE LTV FILTER
# ----------------------------------
# The bot always filters out markets where the collateral is worth less than
# 40% of the loan in USD terms.  Tokens listed HERE bypass that filter —
# you are explicitly trusting them regardless.  Tokens NOT listed fall back
# to the LTV filter and then use the 'default' allocation below if they pass.
#
# WHY STALE LTV CAUSES FALSE BLOCKS
# ------------------------------------
# SOL loans created 4 weeks ago when SOL=$80 show as 80% LTV even though
# SOL is now $160 (real LTV = 40%).  Listing SOL here bypasses the stale
# calculation and trusts your explicit allocation instead.
#
# ADD ANY TOKEN
# ---------------
# You can add any collateral mint to this file at any time.  Just paste the
# mint address as a new key under 'allocations' with your desired fraction.
# The bot picks it up on the next run — no code change needed.

