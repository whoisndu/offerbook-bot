name: Token arbitrage scan

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      fake_test_spread:
        description: "TEMPORARY: send a one-off test email instead of scanning (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests python-dotenv

      - name: Run arbitrage scan
        env:
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          FAKE_TEST_SPREAD: ${{ github.event.inputs.fake_test_spread }}
        run: python3 arbitrage_scanner.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add arbitrage_scanner_state.json
          git diff --staged --quiet || git commit -m "Update arbitrage scanner state [skip ci]"
          git push
